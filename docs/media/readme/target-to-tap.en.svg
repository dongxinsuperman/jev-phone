<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1860" viewBox="0 0 1000 930"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7ca18a"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#263d32}.title{font-size:28px;font-weight:650}.step{font-size:23px;font-weight:600}.body{font-size:19px;fill:#52675a}.mono{font-family:ui-monospace,Menlo,monospace}.tag{font-size:13px;letter-spacing:1.4px;fill:#769080}</style><rect width="1000" height="930" rx="18" fill="#f3f5f0"/><text x="35" y="39" class="tag" >TARGET → REGION ID → COORDINATES → TAP</text><text x="35" y="82" class="title" >From a target to a device tap</text><rect x="35" y="104" width="930" height="52" rx="10" fill="#e3efe4"/><text x="55" y="138" class="step" >Target: tap the upper-left avatar</text><rect x="35" y="182" width="930" height="145" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="219" class="step" >1  Read actionable regions</text><text x="58" y="255" class="body" >SDK reads the current UI tree and screenshot.</text><text x="58" y="287" class="body" >Save the region bounds; the label may be empty.</text><rect x="638" y="204" width="300" height="100" rx="10" fill="#f0f5ee"/><text x="660" y="238" class="step mono" >N02</text><text x="660" y="273" class="mono" font-size="15">bounds: [120,240,200,320]</text><path d="M500 330V351" stroke="#7ca18a" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="356" width="930" height="210" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="393" class="step" >2  Draw rectangles and assign IDs</text><text x="58" y="429" class="body" >Use the region corners to mark the screenshot.</text><text x="58" y="461" class="body" >The avatar region is candidate N02.</text><text x="58" y="501" class="mono" font-size="16">(120,240) ───── (200,240)</text><text x="58" y="530" class="mono" font-size="16">(120,320) ───── (200,320)</text><rect x="659" y="373" width="256" height="174" rx="12" fill="#eef4ed"/><rect x="713" y="404" width="145" height="125" fill="none" stroke="#d34b3b" stroke-width="3"/><rect x="713" y="404" width="54" height="24" fill="white"/><text x="720" y="422" font-size="18" fill="#b93226" class="mono">N02</text><circle cx="785" cy="454" r="22" fill="#93bda2"/><path d="M746 504Q785 453 824 504" fill="#547d62"/><path d="M500 569V590" stroke="#7ca18a" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="595" width="930" height="135" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="632" class="step" >3  Ask Jev to choose a candidate</text><text x="58" y="668" class="body" >Send the current target and annotated screenshot.</text><text x="58" y="700" class="body" >Model output: N02</text><rect x="697" y="626" width="220" height="73" rx="12" fill="#e3efe4"/><text x="727" y="674" class="step mono" >choice: N02</text><path d="M500 733V754" stroke="#7ca18a" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="759" width="930" height="140" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="796" class="step" >4  Resolve the ID and execute</text><text x="58" y="832" class="body" >The SDK looks up the bounds for N02.</text><text x="58" y="864" class="body" >Tap the region center: (160, 280)</text><rect x="680" y="784" width="257" height="86" rx="10" fill="#e3efe4"/><text x="710" y="817" class="mono" font-size="17">N02 → bounds</text><text x="704" y="847" class="step mono" >tap(160, 280)</text><text x="35" y="913" class="body" font-size="15">Illustration only: IDs and coordinates explain the mapping, not a benchmark.</text></svg>