<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1860" viewBox="0 0 1000 930"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7ca18a"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#263d32}.title{font-size:28px;font-weight:650}.step{font-size:23px;font-weight:600}.body{font-size:19px;fill:#52675a}.mono{font-family:ui-monospace,Menlo,monospace}.tag{font-size:13px;letter-spacing:1.4px;fill:#769080}</style><rect width="1000" height="930" rx="18" fill="#f3f5f0"/><text x="35" y="39" class="tag" >TARGET → REGION ID → COORDINATES → TAP</text><text x="35" y="82" class="title" >一个目标，怎样变成一次设备点击</text><rect x="35" y="104" width="930" height="52" rx="10" fill="#e3efe4"/><text x="55" y="138" class="step" >示例目标：点击左上角头像</text><rect x="35" y="182" width="930" height="145" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="219" class="step" >1  提取可操作区域</text><text x="58" y="255" class="body" >组件读取当前系统树与截图，记录元素边界。</text><text x="58" y="287" class="body" >元素文字可以为空，位置由边界确定。</text><rect x="638" y="204" width="300" height="100" rx="10" fill="#f0f5ee"/><text x="660" y="238" class="step mono" >N02</text><text x="660" y="273" class="mono" font-size="15">bounds: [120,240,200,320]</text><path d="M500 330V351" stroke="#7ca18a" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="356" width="930" height="210" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="393" class="step" >2  画出矩形并标记编号</text><text x="58" y="429" class="body" >依据元素四角，在截图上勾勒矩形区域。</text><text x="58" y="461" class="body" >头像所在区域编号为 N02。</text><text x="58" y="501" class="mono" font-size="16">(120,240) ───── (200,240)</text><text x="58" y="530" class="mono" font-size="16">(120,320) ───── (200,320)</text><rect x="659" y="373" width="256" height="174" rx="12" fill="#eef4ed"/><rect x="713" y="404" width="145" height="125" fill="none" stroke="#d34b3b" stroke-width="3"/><rect x="713" y="404" width="54" height="24" fill="white"/><text x="720" y="422" font-size="18" fill="#b93226" class="mono">N02</text><circle cx="785" cy="454" r="22" fill="#93bda2"/><path d="M746 504Q785 453 824 504" fill="#547d62"/><path d="M500 569V590" stroke="#7ca18a" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="595" width="930" height="135" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="632" class="step" >3  让 Jev 选择候选</text><text x="58" y="668" class="body" >发送当前点击目标与带编号的截图。</text><text x="58" y="700" class="body" >模型返回：N02</text><rect x="697" y="626" width="220" height="73" rx="12" fill="#e3efe4"/><text x="727" y="674" class="step mono" >choice: N02</text><path d="M500 733V754" stroke="#7ca18a" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="759" width="930" height="140" rx="14" fill="white" stroke="#d6e0d4"/><text x="58" y="796" class="step" >4  根据编号定位并执行</text><text x="58" y="832" class="body" >组件查回 N02 的边界，计算区域中心。</text><text x="58" y="864" class="body" >驱动点击：(160, 280)</text><rect x="680" y="784" width="257" height="86" rx="10" fill="#e3efe4"/><text x="710" y="817" class="mono" font-size="17">N02 → bounds</text><text x="704" y="847" class="step mono" >tap(160, 280)</text><text x="35" y="913" class="body" font-size="15">原理示意：编号和坐标仅用于解释映射，不代表实测画面或性能数据。</text></svg>